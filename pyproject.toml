[project]
name = "nhs-performance-dashboard"
version = "1.0.0"
description = "Clinical intelligence dashboard for monitoring NHS referral waiting lists."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "duckdb==1.5.3",
    "faker==40.23.0",
    "fastapi==0.136.3",
    "httpx2==2.4.0",
    "hypothesis==6.155.2",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "nhs-number==1.3.10",
    "polars==1.41.2",
    "pyarrow==24.0.0",
    "pydantic==2.13.4",
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
    "starlette==1.3.1",
    "tqdm==4.68.2",
    "uvicorn==0.49.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.155.2",
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = [
    "."
]

python_files = [
    "test_*.py"
]

python_functions = [
    "test_*"
]

norecursedirs = [
    "venv",
    ".venv",
    ".git",
    "__pycache__",
    "data",
    "scripts",
]

addopts = [
    "-v",
    "-s",
    "--strict-markers",
    "--cov=app",
    "--cov=scripts",
    "--cov-report=term-missing",
]

[tool.uv]
package = false
