<!-- 
    Top navigation bar for the NHS Performance Dashboard.
    Provides branding on the left and a link to raw JSON data on the right.
-->

<nav class="navbar">
    <div class="container mx-auto flex justify-between items-center">

        <!-- Left side: Dashboard title / home link -->
        <div class="flex items-center space-x-4">
            <a href="/" 
               class="navbar-brand">
                NHS Performance Dashboard
            </a>
        </div>

        <!-- Right side: Link to raw JSON API endpoint -->
        <div class="flex items-center space-x-4">
            <a href="/api/patients" target="_blank"
               class="navbar-button">
               Raw Data Access (JSON)
            </a>

            <!-- Theme toggle button -->
            <button id="themeToggle"
                    class="navbar-button">
                Toggle Theme
            </button>
        </div>

    </div>
</nav>

<!-- JavaScript -->
<script>
	// Simple theme toggle: switches between dark and light
    document.getElementById('themeToggle').addEventListener('click', () => {
        const html = document.documentElement;
        html.classList.toggle('dark');
        // Optional: persist preference
        localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });

    // Restore saved theme on load
    if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
