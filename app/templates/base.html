<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="{{ url_for('static', path='css/dashboard.css') }}">

    <title>
        {% block title %}
            NHS Performance Dashboard
        {% endblock %}
    </title>

    <!-- Tailwind CDN -->
    <script>
        tailwind = {
            config: {
                darkMode: 'class'
            }
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="font-sans">

    {% include "html_components/navbar.html" %}

    <main class="container mx-auto py-8 px-4">

        {% block content %}
        {% endblock %}

    </main>

    <footer class="border-t border-gray-300 dark:border-gray-800 mt-12 py-6 text-center text-gray-600 dark:text-gray-400 text-sm">
        &copy; 2026 Python Developer Data Systems Pilot — Internal Use Only
    </footer>

    {% block scripts %}
        {% include "js_components/js_scripts.html" %}
    {% endblock %}

</body>

</html>
